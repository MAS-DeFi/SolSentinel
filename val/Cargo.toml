[package]
name = "val"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Production-safe Firedancer lifecycle management"
publish = false

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"
nix = { version = "0.31.3", features = ["user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tracing = "0.1.44"
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.0"

[dev-dependencies]
clap_complete = "4.6.9"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
